version: '3.8'

services:
  leados_postgres:
    image: pgvector/pgvector:pg16    # pg16, arm64 compatible
    container_name: leados_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: leados
    ports:
      - "5434:5432"                  # 5434 external, avoids all conflicts
    volumes:
      - leados_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leados"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  leados_postgres_data:
    driver: local